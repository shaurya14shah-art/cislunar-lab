<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cislunar Lab</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
</head>
<body>
<canvas id="stage" aria-label="3D chart"></canvas>
<svg id="leaders" aria-hidden="true"></svg>
<div id="labels"></div>

<header id="cartouche">
  <h1>Cislunar Lab</h1>
  <p id="sheet-title"></p>
  <nav id="sheets" aria-label="Chart sheets">
    <button data-sheet="A" aria-pressed="true">Earth–Moon chart</button>
    <button data-sheet="B" aria-pressed="false">Build-your-own system</button>
  </nav>
  <div id="sheet-controls"></div>
</header>

<aside id="legend" aria-label="Chart key"></aside>
<section id="callout" hidden></section>
<section id="inset" hidden></section>

<footer id="ruler">
  <div class="transport">
    <button id="rev" title="Play backwards">◀</button>
    <button id="play" title="Play or pause">Play</button>
    <label class="speed">speed <input id="speed" type="range" min="-2" max="2" step="0.1" value="0"><output id="speed-out">×1</output></label>
  </div>
  <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Time">
  <output id="clock"></output>
  <output id="drift" title="How well the conserved quantity is being conserved. Smaller is better."></output>
  <div class="export">
    <button id="png">Save picture</button>
    <button id="csv">Save data</button>
  </div>
</footer>
<div id="toast" role="status" hidden></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
